<!doctype html>
<html lang="zh-Hant-TW"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com">
<meta name="robots" content="noindex">
<title>萬丹公托待辦</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="待辦">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#FAF1CF">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#26241F">
<link rel="stylesheet" href="style.css">
</head><body>
<div class="statusband" aria-hidden="true"></div>
<div class="boot" id="boot"><h1>萬丹公托待辦</h1><div class="bar"><i id="bootBar"></i></div><div class="pct" id="bootPct">0%</div><div class="hint">載入中，如果一直停住，請確認網路後重新開啟。</div></div>
<div class="wrap" id="login" hidden>
  <h1>萬丹公托待辦</h1>
  <div class="status" id="lineHint" hidden>你現在是在 LINE 裡開啟，這裡的登入不會留下來。請按右下角的選單，選「用 Safari 開啟」。</div>
  <form id="loginForm" class="card">
    <label>電子郵件<input type="email" id="lEmail" autocomplete="username" required></label>
    <label>密碼<input type="password" id="lPw" autocomplete="current-password" required></label>
    <div class="actions"><button type="button" class="btn" id="forgot">忘記密碼</button><button class="btn primary">登入</button></div>
    <div id="lMsg" role="status"></div>
  </form>
</div>
<div class="wrap" id="app" hidden>
  <aside class="side">
    <header class="brand"><h1>萬丹公托待辦</h1><div class="date" id="date"></div></header>
    <button class="add" id="add">＋ 新增事項</button>
    <button class="shade" id="moreShade" aria-label="關閉更多選單" tabindex="-1" hidden></button>
    <nav class="tabs" id="tabs" aria-label="頁面">
      <button class="tab" data-view="today"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 8a4 4 0 1 0 0 8a4 4 0 0 0 0-8zM12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></svg>今天</button>
      <button class="tab" data-view="all"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4 5.5l1 1 1.5-2M4 11.5l1 1 1.5-2M4 17.5l1 1 1.5-2"/></svg>全部事項</button>
      <button class="tab" data-view="cal"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M6 5h12a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2zM4 10h16M8 3v4M16 3v4"/></svg>日曆</button>
      <button class="tab" data-view="kpi"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 20V12M12 20V5M19 20v-5"/></svg>KPI</button>
      <button class="tab moretab" id="moreBtn" aria-expanded="false" aria-controls="moreMenu"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 11a1 1 0 1 0 0 2a1 1 0 0 0 0-2zM12 11a1 1 0 1 0 0 2a1 1 0 0 0 0-2zM19 11a1 1 0 1 0 0 2a1 1 0 0 0 0-2z"/></svg>更多</button>
      <div class="extra" id="moreMenu">
        <button class="tab" data-view="log"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18a9 9 0 0 0 0-18zM8 12l3 3 5-6"/></svg>完成紀錄</button>
        <button class="tab" data-view="set"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10M16 5v4M8 15v4"/></svg>設定</button>
        <button class="tab" data-view="help"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18a9 9 0 0 0 0-18zM9.5 9.5a2.5 2.5 0 1 1 3.6 2.2c-.7.4-1.1.9-1.1 1.8M12 17h.01"/></svg>說明</button>
      </div>
    </nav>
  </aside>
  <div class="content">
    <div class="netbar" id="netBar" role="status" hidden></div>
    <div class="pagehead">
      <h2 class="pagename" id="pageName">今天</h2>
      <div class="people" role="group" aria-label="負責人">
        <button class="chip" data-who="all">全部</button>
        <button class="chip" data-who="director">主任</button>
        <button class="chip" data-who="admin">行政</button>
      </div>
    </div>
    <div class="tally" id="tally"></div>
    <div class="lineinfo" id="lineInfo" hidden></div>
    <div id="status" class="status" hidden></div>
    <div class="search" id="searchWrap" hidden><input type="search" id="allSearch" placeholder="找事項，例如：核銷" aria-label="找事項" enterkeyhint="search" autocomplete="off"></div>
    <main id="view"><div class="empty">正在載入事項…</div></main>
  </div>
</div>
 <button class="update" id="updateBar" hidden>有新版本，按這裡更新</button>
<div class="toast" id="toast" hidden role="status"></div>
<dialog id="dlg"><form id="frm" method="dialog">
  <h2 id="dlgTitle">新增事項</h2>
  <button type="button" class="btn" id="toPlan">要辦自辦研習？按這裡生成計畫</button>
  <label>要做的事（請勿填幼兒姓名或個資）<input type="text" id="fTitle" required maxlength="80"></label>
  <div class="two">
    <label>負責人<select id="fWho"><option value="admin">行政</option><option value="director">主任</option></select></label>
    <label>多久一次<select id="fFreq"><option value="once">只做一次</option><option value="daily">每個上班日</option><option value="weekly">每週</option><option value="monthly">每月</option><option value="months">指定月份</option><option value="adhoc">不定期</option></select></label>
  </div>
  <label id="wDate">期限<input type="date" id="fDate"></label>
  <label id="wWeek">每週星期幾前要完成<select id="fWeekday"><option value="1">週一</option><option value="2">週二</option><option value="3">週三</option><option value="4">週四</option><option value="5">週五</option></select></label>
  <div id="wMonths"><div class="sub">哪幾個月</div><div class="mgrid" id="mgrid"></div></div>
  <div class="two" id="wDay">
    <label>當月幾號到期（31＝月底）<input type="number" id="fDay" min="1" max="31" inputmode="numeric"></label>
    <label hidden>提前幾天提醒<input type="number" id="fLead" min="0" max="120"></label>
  </div>
  <label>備註（請勿填幼兒姓名或個資）<input type="text" id="fNote" maxlength="120"></label>
  <label class="check" id="wRoll"><input type="checkbox" id="fRoll">遇假日順延到下一個上班日</label>
  <label class="check" id="wSend"><input type="checkbox" id="fSend"><span id="wSendText">要送出，送出才算結案</span></label>
  <label class="check"><input type="checkbox" id="fGov">要交給縣政府</label>
  <label class="check" id="wVerify"><input type="checkbox" id="fVerify">日期還要確認</label>
  <div class="actions">
    <button type="button" class="btn danger" id="del" hidden>刪除</button>
    <button type="button" class="btn" id="cancel">取消</button>
    <button type="submit" class="btn primary">儲存</button>
  </div>
</form></dialog>
<dialog id="planDlg"><form id="planForm" method="dialog">
  <h2 id="planTitle">自辦研習計畫生成</h2>
  <p class="hint">填好後，核備縣府會在課程前兩週出現，成果報告會在課程結束隔天出現。</p>
  <label>研習主題（可不填）<input type="text" id="pName" maxlength="40"></label>
  <label>計畫完成期限<input type="date" id="pDeadline" required></label>
  <div class="two">
    <label>課程日期<input type="date" id="pStart" required></label>
    <label>結束日期（一天可不填）<input type="date" id="pEnd"></label>
  </div>
  <label>課程時間<input type="text" id="pTime" maxlength="30" placeholder="例如 09:00–12:00"></label>
  <div class="actions">
    <button type="button" class="btn danger" id="planDel" hidden>取消這場研習</button>
    <button type="button" class="btn" id="planCancel">關閉</button>
    <button type="submit" class="btn primary">儲存</button>
  </div>
</form></dialog>
<dialog id="updDlg"><form id="updForm" method="dialog">
  <h2>更新到新版本</h2>
  <p class="hint">打勾和已儲存的事項都已存好，更新不會影響資料，也不用重新登入。</p>
  <div class="actions"><button type="button" class="btn" id="updLater">稍後再說</button><button class="btn primary">立即更新</button></div>
</form></dialog>
<dialog id="pwDlg"><form id="pwForm" method="dialog">
  <h2>修改密碼</h2>
  <p class="hint">新密碼只有你自己知道，其他人和協助者都看不到。</p>
  <input type="email" id="pwUser" autocomplete="username" hidden>
  <label>目前的密碼<input type="password" id="pwOld" autocomplete="current-password" required></label>
  <label>新密碼（至少 8 碼）<input type="password" id="pwNew" autocomplete="new-password" minlength="8" required></label>
  <label>再輸入一次新密碼<input type="password" id="pwNew2" autocomplete="new-password" minlength="8" required></label>
  <div id="pwMsg" role="status"></div>
  <div class="actions"><button type="button" class="btn" id="pwCancel">取消</button><button class="btn primary" id="pwSave">儲存</button></div>
</form></dialog>
<script type="module" src="app.js"></script>
</body></html>
